<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>义符 · 词根拆解器</title>
<style>
:root{
  --paper:#f7f4ee; --paper2:#fffdf8;
  --ink:#221f1b; --ink2:#6b6357; --ink3:#9c9385;
  --zhu:#b8452f;   /* 朱砂 · 汉语侧 */
  --zhu-bg:#f6e6e0;
  --dian:#2f6d8f;  /* 靛青 · 英语侧 */
  --dian-bg:#e2edf4;
  --jin:#c2922c;   /* 金 · 中枢 */
  --jin-bg:#f8efd8;
  --line:#e3ddd1;
  /* 底上的描边与文字（DESIGN.md §1.2 新增，收编散落的硬编码色） */
  --zhu-line:#eed6cd;  --zhu-ink:#6d4a3f;
  --dian-line:#cfe0ea; --dian-ink:#2f5570;
  --jin-line:#e8d5a5;  --jin-ink:#7a5a17;
  --on:#fff; --ink-story:#3a352e; --line2:#ded7c9;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",Georgia,serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.6;
  overflow:hidden;
  height:100%;
  display:flex;flex-direction:column;
}
/* 纸纹 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(0,0,0,.028) 1px,transparent 1px);
  background-size:22px 22px;
}

/* ---------- 顶栏 ---------- */
header{
  position:relative;z-index:5;flex:none;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:16px 24px;border-bottom:1px solid var(--line);
  background:var(--paper);
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:8px}
.brand b{font-family:var(--serif);font-size:26px;letter-spacing:.14em;font-weight:600}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:.22em}
.tabs{display:flex;gap:8px;margin-left:0;flex-wrap:wrap}
.tab{
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  padding:8px 16px;border-radius:2px;cursor:pointer;
  font-family:var(--serif);font-size:16px;letter-spacing:.08em;
  transition:.22s;
}
.tab:hover{border-color:var(--jin);color:var(--ink)}
.tab.on{
  background:var(--jin);border-color:var(--jin);color:var(--on);
}
.hint{margin-left:16px;font-size:12px;color:var(--ink3)}
@media(max-width:820px){.hint{display:none}}

/* ---------- 主体三栏 ---------- */
main{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr minmax(180px,230px) 1fr;
  gap:0;
}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.col{overflow-y:auto;padding:20px 20px 96px;position:relative;z-index:1}
.col.han{border-right:1px solid var(--line)}
.col.eng{border-left:1px solid var(--line)}
.col::-webkit-scrollbar{width:8px}
.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

.sidehead{
  display:flex;align-items:center;gap:8px;margin-bottom:16px;
  font-size:12px;letter-spacing:.2em;color:var(--ink3);
}
.sidehead i{width:7px;height:7px;border-radius:50%;display:block}
.han .sidehead i{background:var(--zhu)}
.eng .sidehead i{background:var(--dian)}

/* 义符卡片（左） */
.fu{
  display:flex;gap:16px;align-items:center;
  padding:16px;margin-bottom:12px;border-radius:2px;
  background:var(--paper2);border:1px solid var(--line);
  transition:.25s;
}
.fu.hot{border-color:var(--zhu);background:var(--zhu-bg)}
.fu .big{font-family:var(--serif);font-size:44px;line-height:1;color:var(--zhu)}
.fu .meta{font-size:12px;color:var(--ink3);line-height:1.75}
.fu .meta b{display:block;font-size:13px;color:var(--ink2);font-weight:500;letter-spacing:.06em}
.fu .meta .morph{font-family:var(--serif);color:var(--zhu);font-size:13px}

/* 汉字格 */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:16px}
.hz{
  aspect-ratio:1;border-radius:2px;border:1px solid var(--line);background:var(--paper2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:.2s;
}
.hz:hover{border-color:var(--zhu);transform:translateY(-2px)}
.hz.hot{background:var(--zhu);border-color:var(--zhu)}
.hz .c{font-family:var(--serif);font-size:26px;line-height:1.1}
.hz .p{font-size:11px;color:var(--ink3);transform:scale(.92)}
.hz.hot .c,.hz.hot .p{color:var(--on)}

/* 本词对照格：点英文词时，这里放它在汉语里的对应字 */
#hzxbox:empty{display:none}
.hzxrow{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px}
.hzxrow .lab{font-size:11px;color:var(--ink3);letter-spacing:.08em;line-height:1.65}
.hzxrow .hz{width:66px;flex:0 0 66px;cursor:default}
.hzxrow .hz:hover{transform:none;border-color:var(--zhu)}

/* 词根卡片（右） */
.root{
  padding:12px 16px;margin-bottom:12px;border-radius:2px;
  background:var(--paper2);border:1px solid var(--line);transition:.25s;
}
.root.hot{border-color:var(--dian);background:var(--dian-bg)}
.root .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.root .form{font-size:19px;font-weight:600;color:var(--dian);letter-spacing:.02em}
.root .src{font-size:11px;color:var(--ink3);border:1px solid var(--line);
  padding:3px 12px;border-radius:2px;background:var(--paper)}
.root .gloss{font-size:12px;color:var(--ink2)}

.wgrid{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.w{
  padding:12px 16px;border-radius:2px;border:1px solid var(--line);background:var(--paper2);
  cursor:pointer;transition:.2s;
}
.w:hover{border-color:var(--dian);transform:translateX(3px)}
.w.hot{background:var(--dian);border-color:var(--dian)}
.w .sp{font-size:16px;font-weight:600;letter-spacing:.01em}
.w .cn{font-size:12px;color:var(--ink3);margin-top:2px}
.w.hot .sp,.w.hot .cn{color:var(--on)}

/* 中枢 */
.hub{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;position:relative;z-index:3;pointer-events:none;
}
.disc{
  width:132px;height:132px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--jin-bg);
  border:1px solid var(--jin-line);
  transition:.35s;
}
.disc.pulse{border-color:var(--jin);transform:scale(1.045)}
.disc .ch{font-family:var(--serif);font-size:50px;line-height:1;color:var(--jin-ink);font-weight:600}
.disc .sub{font-size:11px;color:var(--jin-ink);letter-spacing:.16em;margin-top:4px}
.hublabel{font-size:11px;letter-spacing:.3em;color:var(--ink3);text-align:center}
.tally{
  font-size:11px;color:var(--ink3);text-align:center;line-height:1.9;
  background:var(--paper2);border:1px solid var(--line);
  border-radius:2px;padding:8px 12px;pointer-events:auto;
}
.tally b{color:var(--ink2);font-weight:600}

/* ---------- 详情抽屉 ---------- */
#detail{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  max-height:56vh;overflow-y:auto;
  background:var(--paper2);border-top:1px solid var(--line);
  box-shadow:0 -12px 44px rgba(34,31,27,.13);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,.9,.3,1);
}
#detail.open{transform:translateY(0)}
.dwrap{max-width:1020px;margin:0 auto;padding:32px 24px 48px}
.dhead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dhead .w1{font-size:26px;font-weight:700;letter-spacing:.01em}
.dhead .ipa{font-size:14px;color:var(--ink3)}
.dhead .mean{font-size:15px;color:var(--ink2)}
.dclose{
  margin-left:auto;border:1px solid var(--line);background:var(--paper);
  width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink2);
  font-size:16px;line-height:1;transition:.2s
}
.dclose:hover{background:var(--ink);color:var(--on);border-color:var(--ink)}

/* 拆解链 */
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 8px}
.part{
  padding:8px 16px;border-radius:2px;background:var(--dian-bg);
  border:1px solid var(--dian-line);text-align:center;min-width:74px;
}
.part .p1{font-size:16px;font-weight:700;color:var(--dian)}
.part .p2{font-size:11px;color:var(--ink3);margin-top:2px}
.plus{color:var(--ink3);font-size:15px}
.arrow{color:var(--jin);font-size:19px;font-weight:700;padding:0 4px}
.result{
  padding:8px 16px;border-radius:2px;background:var(--jin-bg);
  border:1px solid var(--jin-line);font-size:15px;font-weight:600;color:var(--jin-ink);
}
.xref{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:16px;padding:12px 16px;border-radius:2px;
  background:var(--zhu-bg);border:1px solid var(--zhu-line);
}
.xref .k{font-size:11px;color:var(--zhu-ink);letter-spacing:.1em}
.xref .hzbig{font-family:var(--serif);font-size:30px;color:var(--zhu);line-height:1}
.xref .txt{font-size:13px;color:var(--zhu-ink);flex:1;min-width:180px}

.sec{margin-top:20px}
.sec h4{
  font-size:11px;letter-spacing:.24em;color:var(--ink3);
  font-weight:500;margin:0 0 8px;
}
.story{font-size:14px;line-height:1.95;color:var(--ink-story)}
.story em{font-style:normal;color:var(--zhu);font-weight:600}
.story b{color:var(--dian);font-weight:600}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.rel span{
  padding:3px 12px;border-radius:2px;background:var(--paper);
  border:1px solid var(--line);font-size:13px;color:var(--ink2);cursor:pointer;transition:.2s
}
.rel span:hover{border-color:var(--dian);color:var(--dian)}

.note{
  margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--ink3);line-height:1.85;
}

/* 两条演变线 */
.evo{display:flex;flex-direction:column;gap:12px}
.evorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{
  flex:none;width:26px;height:26px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;font-weight:600;color:var(--on);
}
.tag.h{background:var(--zhu)} .tag.e{background:var(--dian)}
.step{
  padding:4px 12px;border-radius:2px;font-size:12px;line-height:1.5;
  background:var(--paper);border:1px solid var(--line);color:var(--ink2);
}
.evorow.h .step:last-child{background:var(--zhu-bg);border-color:var(--zhu-line);color:var(--zhu);font-weight:600}
.evorow.e .step:last-child{background:var(--dian-bg);border-color:var(--dian-line);color:var(--dian);font-weight:600}
.arw{color:var(--ink3);font-size:12px;flex:none}
.evofig{display:block;width:100%;max-width:720px;margin-top:12px;border:1px solid var(--line);border-radius:2px}

@media(max-width:900px){
  main{grid-template-columns:1fr}
  .col.han{border-right:0;border-bottom:1px solid var(--line)}
  .col.eng{border-left:0;border-top:1px solid var(--line)}
  .hub{order:-1;padding:20px 0}
  #wires{display:none}
  .col{padding-bottom:40px;max-height:none}
}
/* ============================================================
   玩法层（新增）：把演示升级为可用的工具
   以下为新增界面，遵循 2px 圆角、无渐变、无发光阴影、无 emoji。
   图谱漫游沿用原有纸/墨视觉，未改动。
   ============================================================ */
.plays{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.play{
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  padding:8px 16px;border-radius:2px;cursor:pointer;
  font-family:var(--serif);font-size:15px;letter-spacing:.06em;transition:.2s;
}
.play:hover{border-color:var(--jin);color:var(--ink)}
.play.on{background:var(--ink);border-color:var(--ink);color:var(--on)}

.views{position:relative;z-index:1;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none}
.view.on{display:block}
#board.on{display:grid}

.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 48px}
.vhead{margin-bottom:24px}
.vhead h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.1em;margin:0 0 8px}
.vhead p{margin:0;color:var(--ink3);font-size:13px;line-height:1.8}
.vsubhead{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.08em;margin:32px 0 12px}

/* 提示面板 */
.notice{
  border:1px solid var(--jin-line);background:var(--jin-bg);border-radius:2px;
  padding:16px;margin-bottom:20px;font-size:13px;color:var(--jin-ink);line-height:1.9;
}
.notice b{color:var(--jin-ink)}
.notice code{
  background:var(--paper2);border:1px solid var(--jin-line);border-radius:2px;
  padding:4px 8px;font-family:var(--mono);font-size:12px;word-break:break-all;
}
.notice.err{border-color:var(--zhu-line);background:var(--zhu-bg);color:var(--zhu-ink)}
.notice.err b{color:var(--zhu)}
.notice.info{border-color:var(--dian-line);background:var(--dian-bg);color:var(--dian-ink)}
.notice.info b{color:var(--dian)}

/* 第2玩法：词根拆解器 */
.searchbar{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-bottom:8px}
.searchbar input{
  flex:1 1 260px;min-width:0;padding:12px 16px;font-size:16px;
  border:1px solid var(--line);border-radius:2px;background:var(--paper2);
  color:var(--ink);font-family:var(--sans);
}
.searchbar input:focus{outline:none;border-color:var(--dian)}
.btn{
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  padding:12px 16px;border-radius:2px;cursor:pointer;font-size:14px;font-family:var(--sans);
  transition:.2s;white-space:nowrap;
}
.btn:hover{border-color:var(--dian);color:var(--dian)}
.btn.primary{background:var(--dian);border-color:var(--dian);color:var(--on)}
.btn.primary:hover{opacity:.9;color:var(--on)}
.btn.small{padding:8px 12px;font-size:13px}
.samples{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px;font-size:12px;color:var(--ink3)}
.chip{
  border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  padding:4px 12px;border-radius:2px;cursor:pointer;font-size:13px;transition:.2s;display:inline-block;
}
.chip:hover{border-color:var(--jin);color:var(--ink)}

.res{margin-top:24px}
.badge{font-size:11px;padding:3px 12px;border-radius:2px;letter-spacing:.06em;white-space:nowrap}
.badge.ok{background:var(--zhu);color:var(--on)}
.badge.wait{background:transparent;border:1px solid var(--ink3);color:var(--ink3)}
.wtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.wtop .hw{font-size:30px;font-weight:700;letter-spacing:.01em;word-break:break-word}
.wtop .ipa{font-size:14px;color:var(--ink3)}
.wtop .pos{font-size:12px;color:var(--ink3)}
.wtop .def{font-size:15px;color:var(--ink2);flex:1 1 220px;min-width:0}

.block{margin-top:24px}
.block h4{font-size:11px;letter-spacing:.24em;color:var(--ink3);font-weight:500;margin:0 0 12px}

.seg{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--paper2);
     border:1px solid var(--line);border-radius:2px;padding:12px 16px;max-width:100%}
.segp{padding:8px 12px;border-radius:2px;text-align:center;min-width:44px}
.segp .t{font-size:19px;font-weight:700;font-family:var(--serif);line-height:1.1;word-break:break-word}
.segp .g{font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:.04em}
.segp.root{background:var(--dian-bg);border:1px solid var(--dian-line)}
.segp.root .t{color:var(--dian)}
.segp.prefix{background:var(--jin-bg);border:1px solid var(--jin-line)}
.segp.prefix .t{color:var(--jin-ink)}
.segp.suffix{background:var(--paper);border:1px dashed var(--line)}
.segp.suffix .t{color:var(--ink2)}
.segp.base{background:var(--paper);border:1px dashed var(--line)}
.segp.base .t{color:var(--ink3)}
.segnote{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.85}

.kv{display:flex;flex-direction:column;gap:8px}
.kvrow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.kvrow .k{font-size:11px;letter-spacing:.14em;color:var(--ink3);flex:none;min-width:78px}
.kvrow .v{font-size:14px;color:var(--ink2)}
.pill{display:inline-block;padding:3px 12px;border-radius:2px;background:var(--paper);
      border:1px solid var(--line);font-size:13px;color:var(--ink2);margin:0 8px 8px 0}

.chainv{display:flex;align-items:stretch;flex-wrap:wrap;row-gap:12px}
.cnode{border:1px solid var(--line);background:var(--paper2);border-radius:2px;
  padding:8px 12px;min-width:0;max-width:100%}
.cnode .lang{display:block;font-size:11px;color:var(--ink3);letter-spacing:.08em}
.cnode .form{display:block;font-size:15px;font-family:var(--serif);color:var(--ink);word-break:break-word}
.carw{color:var(--ink3);align-self:center;padding:0 8px;font-size:13px}

.furow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
       background:var(--zhu-bg);border:1px solid var(--zhu-line);border-radius:2px;padding:12px 16px;margin-bottom:12px}
.furow .big{font-family:var(--serif);font-size:34px;color:var(--zhu);line-height:1}
.furow .txt{font-size:13px;color:var(--zhu-ink);flex:1 1 220px;min-width:0;line-height:1.8}
.empty{font-size:13px;color:var(--ink3);line-height:1.9;
       border:1px dashed var(--line);border-radius:2px;padding:16px;background:var(--paper2)}
.storyx{font-size:14px;line-height:1.95;color:var(--ink-story)}
.storyx em{font-style:normal;color:var(--zhu);font-weight:600}
.storyx b{color:var(--dian);font-weight:600}

/* 第3玩法：词卡 + 小测 + 错题本 */
.cardbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cardbar select{
  padding:8px 12px;border:1px solid var(--line);border-radius:2px;background:var(--paper2);
  color:var(--ink);font-size:14px;font-family:var(--sans);max-width:100%;
}
.tabsx{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:4px}
.tabx{
  border:1px solid transparent;background:transparent;color:var(--ink3);
  padding:8px 16px;border-radius:2px 2px 0 0;cursor:pointer;font-size:14px;font-family:var(--serif);letter-spacing:.06em;
}
.tabx.on{color:var(--ink);border-color:var(--line);border-bottom-color:var(--paper2);background:var(--paper2)}
.pane{display:none}
.pane.on{display:block}
.prog{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:var(--jin);width:0;transition:width .3s}
.progtxt{font-size:12px;color:var(--ink3)}
.flash{max-width:600px;margin:8px auto 0}
.thecard{
  border:1px solid var(--line);background:var(--paper2);border-radius:2px;
  padding:32px 24px;text-align:center;min-height:232px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.thecard .fword{font-size:34px;font-weight:700;letter-spacing:.01em;word-break:break-word}
.thecard .fdef{font-size:15px;color:var(--ink2)}
.thecard .fipa{font-size:13px;color:var(--ink3)}
.thecard .back{align-self:stretch;text-align:left;display:flex;flex-direction:column;gap:12px;width:100%}
.cardbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.mtag{font-size:11px;padding:3px 12px;border-radius:2px;border:1px solid var(--ink3);color:var(--ink3)}
.mtag.known{background:var(--dian);border-color:var(--dian);color:var(--on)}
.mtag.unknown{background:var(--zhu);border-color:var(--zhu);color:var(--on)}
.deckdone{text-align:center;color:var(--ink3);font-size:14px;padding:32px 12px;line-height:2}

.quizq{font-size:15px;color:var(--ink2);text-align:center;margin-bottom:8px}
.quizq b{font-size:26px;color:var(--ink);display:block;margin-top:8px;word-break:break-word}
.quizopts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.quizopt{
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  padding:12px 20px;border-radius:2px;cursor:pointer;font-size:16px;font-family:var(--serif);
  min-width:120px;transition:.2s;
}
.quizopt:hover{border-color:var(--dian)}
.quizopt.right{background:var(--dian-bg);border-color:var(--dian);color:var(--dian);font-weight:700}
.quizopt.wrong{background:var(--zhu-bg);border-color:var(--zhu);color:var(--zhu);font-weight:700}
.quizfb{text-align:center;font-size:14px;margin-top:16px;min-height:24px;color:var(--ink2)}
.quizfb.ok{color:var(--dian)}
.quizfb.no{color:var(--zhu)}
.wrongitem{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  border:1px solid var(--line);background:var(--paper2);border-radius:2px;padding:12px 16px;margin-bottom:8px}
.wrongitem .ww{font-size:16px;font-weight:600;min-width:120px}
.wrongitem .wd{font-size:13px;color:var(--ink3);flex:1 1 200px;min-width:0}

/* 第4玩法：故事线 */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tlitem{position:relative;margin-bottom:24px}
.tlitem::before{
  content:"";position:absolute;left:-24px;top:8px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2px solid var(--jin);
}
.tlitem h3{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:.01em;word-break:break-word}
.tlitem .mean{font-size:13px;color:var(--ink3);margin-bottom:8px}
.tlitem .storyx{font-size:14px;line-height:1.95;color:var(--ink-story);background:var(--paper2);
  border:1px solid var(--line);border-radius:2px;padding:16px}
.relx{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* 窄屏 */
@media(max-width:820px){
  .plays{margin-left:0;width:100%}
}
@media(max-width:900px){
  .wrap{padding:20px 16px 48px}
  .wtop .hw{font-size:26px}
  .thecard .fword{font-size:30px}
  .tl{padding-left:20px}
  .tlitem::before{left:-20px}
}
</style>
</head>

<header>

      <h2>词根拆解器</h2>

    <div class="samples" id="disSamples"></div>
    <div id="disResult"></div>

</section>

<section class="view" id="view-cards" data-k="cards">

const $ = s => document.querySelector(s);
let cur = 'shui';
let sel = null;          // {word: idx}
let selChar = null;

function renderTabs(){
  $('#tabs').innerHTML = Object.entries(DATA).map(([k,v])=>
    `<button class="tab ${k===cur?'on':''}" data-k="${k}">${v.name}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ cur = b.dataset.k; sel = null; selChar = null; closeDetail(); renderAll(); };
  });
}

function renderAll(){
  const d = DATA[cur];
  $('#hubCh').textContent = d.name;
  $('#hubSub').textContent = d.sub;
  $('#tally').innerHTML =
    `汉语义符 <b>${d.fu.length}</b> 个　·　汉字 <b>${d.chars.length}</b> 个<br>` +
    `英语词根 <b>${d.roots.length}</b> 个　·　词条 <b>${d.words.length}</b> 个`;

  // 左：义符
  $('#fus').innerHTML = d.fu.map((f,i)=>
    `<div class="fu" id="fu${i}">
       <div class="big">${f.ch}</div>
       <div class="meta">
         <b>${f.from === f.ch ? '本字' : f.from + ' 的变形'}</b>
         <span class="morph">${f.from} → ${f.ch}</span><br>
         ${f.note}
       </div>
     </div>`).join('');

  // 左：汉字
  $('#hgrid').innerHTML = d.chars.map((c,i)=>
    `<div class="hz" id="hz${i}" data-i="${i}">
       <div class="c">${c.c}</div><div class="p">${c.p}</div>
     </div>`).join('');
  $('#hgrid').querySelectorAll('.hz').forEach(el=>{
    el.onclick = ()=> pickChar(+el.dataset.i);
  });

  // 右：词根
  $('#roots').innerHTML = d.roots.map((r,i)=>
    `<div class="root" id="rt${i}">
       <div class="top">
         <span class="form">${r.form}</span>
         <span class="src">${r.src}</span>
         <span class="gloss">${r.gloss}</span>
       </div>
     </div>`).join('');

  // 右：词
  $('#wnum').textContent = `（${d.words.length}）`;
  $('#wgrid').innerHTML = d.words.map((w,i)=>
    `<div class="w" id="w${i}" data-i="${i}">
       <div class="sp">${w.w}</div>
       <div class="cn">${w.mean}</div>
     </div>`).join('');
  $('#wgrid').querySelectorAll('.w').forEach(el=>{
    el.onclick = ()=> pickWord(+el.dataset.i);
  });

  renderTabs();
  clearHighlight();
}

/* ---------- 高亮与连线 ---------- */
function clearHighlight(){
  document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  $('#wires').innerHTML = '';
  $('#hzxbox').innerHTML = '';
}

function pickWord(i){
  clearHighlight();
  sel = i; selChar = null;
  const d = DATA[cur], w = d.words[i];
  $('#w'+i).classList.add('hot');

  // 命中的词根
  const ri = d.roots.findIndex(r => w.root === r.form);
  if(ri >= 0) $('#rt'+ri).classList.add('hot');

  // 命中的义符（全部点亮 —— 这就是"啊哈"）
  d.fu.forEach((f,j)=> $('#fu'+j).classList.add('hot'));

  // 汉语对应字：用词卡里写好的 w.hz.c，不按位置瞎指。
  // 该字若已经在"同义类汉字"里就直接点亮，否则单开一格"本词对照"。
  const ci = d.chars.findIndex(c => c.c === w.hz.c);
  let target;
  if(ci >= 0){
    target = $('#hz'+ci);
    target?.classList.add('hot');
  }else{
    target = addXrefChip(w.hz.c);
  }

  $('#disc').classList.add('pulse');
  setTimeout(()=>$('#disc').classList.remove('pulse'), 620);

  drawWires($('#w'+i), target);
  openDetail(w);
}

/* 在"同义类汉字"上方插一格：本词在汉语里对应的那个字 */
function addXrefChip(ch){
  $('#hzxbox').innerHTML =
    `<div class="hzxrow">
       <div class="lab">本词对照　这个词在汉语里对应的字</div>
       <div class="hz hot" id="hzx"><div class="c">${esc(ch)}</div></div>
     </div>`;
  return $('#hzx');
}

function pickChar(i){
  clearHighlight();
  selChar = i; sel = null;
  const d = DATA[cur], c = d.chars[i];
  $('#hz'+i).classList.add('hot');
  d.fu.forEach((f,j)=> $('#fu'+j).classList.add('hot'));
  d.roots.forEach((r,j)=> $('#rt'+j)?.classList.add('hot'));
  $('#disc').classList.add('pulse');
  setTimeout(()=>$('#disc').classList.remove('pulse'), 620);
  openCharDetail(c, d);
}

function drawWires(wEl, hEl){
  const svg = $('#wires'), board = $('#board');
  if(window.innerWidth <= 900) return;
  const bb = board.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
  const disc = $('#disc');
  if(!wEl || !hEl || !disc) return;
  const r = e => {
    const x = e.getBoundingClientRect();
    return {l:x.left-bb.left, r:x.right-bb.left, cx:x.left-bb.left+x.width/2,
            cy:x.top-bb.top+x.height/2, t:x.top-bb.top};
  };
  const W = r(wEl), H = r(hEl), D = r(disc);

  const mk = (x1,y1,x2,y2,color,dash) => {
    const mx = (x1+x2)/2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
      fill="none" stroke="${color}" stroke-width="1.7"
      ${dash?'stroke-dasharray="5 5"':''} opacity=".85"
      stroke-linecap="round"/>`;
  };
  const dot = (x,y,c) => `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`;

  // 连线颜色取自 CSS 令牌，避免在 JS 里再写死色值（设计与页面同一份来源）
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const DIAN = cssVar('--dian'), ZHU = cssVar('--zhu');

  svg.innerHTML =
    mk(W.l, W.cy, D.r, D.cy, DIAN, false) +
    mk(D.l, D.cy, H.r, H.cy, ZHU, true) +
    dot(W.l, W.cy, DIAN) + dot(H.r, H.cy, ZHU) +
    dot(D.r, D.cy, DIAN) + dot(D.l, D.cy, ZHU);

  // 只有实线那条做"书写"动画；虚线那条保持虚线观感，别被覆盖
  const solid = svg.querySelectorAll('path')[0];
  if(solid){
    const L = solid.getTotalLength();
    solid.animate([{strokeDasharray:`${L} ${L}`, strokeDashoffset:L},
                   {strokeDasharray:`${L} ${L}`, strokeDashoffset:0}],
                  {duration:620, easing:'cubic-bezier(.3,.8,.3,1)', fill:'forwards'});
  }
}

/* ---------- 词形拆解 ---------- */
/* 依据 af（前/后缀）与 yilei[].root 在词形中定位；定位不到的如实标注，不强行着色。 */
function segWord(word, af, yileis){
  const low = word.toLowerCase(), n = low.length;
  const type = new Array(n).fill('base');
  const meta = new Array(n).fill('');
  const pre = ((af && af[0]) || '').toLowerCase();
  const suf = ((af && af[1]) || '').toLowerCase();
  let pl = 0, sl = 0;
  if(pre && pre.length < n && low.startsWith(pre)){
    for(let i=0;i<pre.length;i++){ type[i]='prefix'; meta[i]='前缀'; }
    pl = pre.length;
  }
  if(suf && (suf.length + pl) < n && low.endsWith(suf)){
    const s = n - suf.length;
    for(let i=s;i<n;i++){ type[i]='suffix'; meta[i]='后缀'; }
    sl = suf.length;
  }
  const end = n - sl;
  const notes = [];
  (yileis || []).forEach(y=>{
    const r = (y.root || '').toLowerCase();
    if(!r){ return; }
    const idx = low.indexOf(r, pl);
    const inRange = idx >= pl && (idx + r.length) <= end;
    let free = false;
    if(inRange){
      free = true;
      for(let i=idx;i<idx+r.length;i++){ if(type[i] !== 'base'){ free = false; break; } }
    }
    if(free){ for(let i=idx;i<idx+r.length;i++){ type[i]='root'; meta[i] = y.yilei + ' · ' + y.root; } }
    notes.push({ok:free, yilei:y.yilei, root:y.root});
  });
  const segs = []; let i = 0;
  while(i<n){ let j=i; while(j<n && type[j]===type[i]) j++; segs.push({t:type[i], s:word.slice(i,j), m:meta[i]}); i=j; }
  return {segs, notes};
}
function segWordHtml(seg){
  const html = seg.segs.map(g=>{
    const lab = g.t==='root' ? (g.m||'词根') : g.t==='prefix' ? '前缀' : g.t==='suffix' ? '后缀' : '未定位';
    return '<span class="segp '+g.t+'"><span class="t">'+esc(g.s)+'</span><span class="g">'+esc(lab)+'</span></span>';
  }).join('<span class="carw">+</span>');
  const nt = seg.notes.map(n=> n.ok
      ? '词根 '+esc(n.root)+'（义类「'+esc(n.yilei)+'」）已在词形中定位。'
      : '词根 '+esc(n.root)+'（义类「'+esc(n.yilei)+'」）未能在词形中直接定位，故不着色。'
    ).join('　·　');
  return '<div class="seg">'+html+'</div>'
    + '<div class="segnote">底色＝词根，黄底＝前后缀，“未定位”＝流水线给出的前后缀在此词形中未能对上，仅按原数据展示。</div>'
    + (nt ? '<div class="segnote">'+nt+'</div>' : '');
}
function chainRender(chain){
  if(!chain || !chain.length) return '<div class="empty">未取到词源链。</div>';
  const nodes = [];
  chain.forEach(it=>{
    const code = it[0], name = it[1], form = it[2] || '';
    const last = nodes[nodes.length-1];
    if(last && last.code===code && last.name===name){
      if(form && last.forms.indexOf(form) < 0) last.forms.push(form);
    } else {
      nodes.push({code:code, name:name, forms: form ? [form] : []});
    }
  });
  const html = nodes.map(n=>{
    const f = n.forms.length ? n.forms.map(esc).join(' · ') : '—';
    return '<span class="cnode"><span class="lang">'+esc(n.name)+'</span><span class="form">'+f+'</span></span>';
  }).join('<span class="carw">→</span>');
  return '<div class="chainv">'+html+'</div>'
    + '<div class="segnote">共 '+chain.length+' 段，合并相邻同语种后为 '+nodes.length+' 段。数据来自词源库，未经人工复核。</div>';
}
function clsName(c){ return ({classical:'古典词源（拉丁 / 希腊）', romance:'罗曼语系', germanic:'日耳曼语系', unknown:'语源未判定', other:'其他'})[c] || c || '未取到'; }
function tagName(t){ return ({gaokao:'高考词表', ielts:'雅思词表', 'gaokao+ielts':'高考+雅思'})[t] || t || '未取到'; }

  const fuHtml = names.length ? names.map(name=>{
    const Y = LOOKUP && LOOKUP.yilei ? LOOKUP.yilei[name] : null;

      return (Y.fu || []).map(f=>'<div class="furow"><span class="big">'+esc(f.ch)+'</span><span class="txt">'+esc(f.note||'')+'（来自「'+esc(f.from||'')+'」）</span></div>').join('');

function loadCardStore(){
  let raw = null;
  try{ raw = localStorage.getItem(CARD_KEY); }catch(e){ raw = null; }   /* 隐私模式会抛，退化为内存态 */
  if(raw){
    try{
      const o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        CARD = {
          mastery:(o.mastery && typeof o.mastery==='object') ? o.mastery : {},
          wrong:(o.wrong && typeof o.wrong==='object') ? o.wrong : {},
          yilei:o.yilei || '水'
        };
      }
    }catch(e){ /* 数据损坏则用默认内存态 */ }
  }
}
function saveCardStore(){
  try{ localStorage.setItem(CARD_KEY, JSON.stringify(CARD)); return true; }
  catch(e){ return false; }   /* 隐私模式：写不进去，仅内存继续可用 */
}
function yileiNames(){
  const names = [];
  Object.values(DATA).forEach(v=>{ if(names.indexOf(v.name) < 0) names.push(v.name); });
  if(LOOKUP && LOOKUP.yilei) Object.keys(LOOKUP.yilei).forEach(n=>{ if(names.indexOf(n) < 0) names.push(n); });
  return names;
}
function deckForYilei(name){
  const out = [];
  Object.values(DATA).forEach(v=>{ if(v.name===name) v.words.forEach(w=>{ if(out.indexOf(w.w) < 0) out.push(w.w); }); });
  if(LOOKUP && LOOKUP.words){
    Object.keys(LOOKUP.words).forEach(w=>{
      if(out.indexOf(w) >= 0) return;
      if((LOOKUP.words[w].yilei || []).some(y=>y.yilei===name)) out.push(w);
    });
  }
  return out;
}
function fillCardYilei(){
  const sel = $('#cardYilei'); if(!sel) return;
  const names = yileiNames();
  if(names.indexOf(CARD.yilei) < 0 && names.length) CARD.yilei = names[0];
  sel.innerHTML = names.map(n=>{
    const c = deckForYilei(n).length;
    return '<option value="'+esc(n)+'"'+(n===CARD.yilei?' selected':'')+'>'+esc(n)+'（'+c+' 词）</option>';
  }).join('');
  sel.onchange = ()=>{ CARD.yilei = sel.value; cardIdx = 0; cardBack = false; quiz = null; saveCardStore(); renderCard(); renderQuiz(); renderWrong(); };
}
function cardWordInfo(word){
  if(DATA_WORDS[word]){
    const d = DATA_WORDS[word];
    return {word:word, def:d.mean, ipa:d.ipa, kind:'data', parts:d.parts, root:d.root, hz:d.hz, reviewed:true};
  }
  if(LOOKUP && LOOKUP.words[word]){
    const v = LOOKUP.words[word];
    return {word:word, def:v.def, ipa:v.ipa, kind:'lookup', af:v.af, yileis:v.yilei, reviewed:!!v.reviewed};
  }
  return null;
}
function cardBackHtml(info){
  if(info.kind==='data'){
    const rootStem = (info.root || '').replace(/-/g,'').toLowerCase();
    const segs = (info.parts||[]).map(p=>{
      const pn = p.p.replace(/-/g,'').toLowerCase();
      const isRoot = !!rootStem && !!pn && (pn.startsWith(rootStem) || rootStem.startsWith(pn));
      return '<span class="segp '+(isRoot?'root':'prefix')+'"><span class="t">'+esc(p.p)+'</span><span class="g">'+esc(p.g)+'</span></span>';
    }).join('<span class="carw">+</span>');
    return '<div class="block"><h4>词　根　拆　解</h4><div class="seg">'+segs+'</div>'
      + '<div class="segnote">以上为人工复核过的拆解。</div></div>'
      + '<div class="block"><h4>汉　语　义　符</h4><div class="furow"><span class="big">'+esc(info.hz.c)+'</span><span class="txt">'+esc(info.hz.note)+'</span></div></div>';
  }
  const seg = segWord(info.word, info.af, info.yileis);
  const names = [];
  (info.yileis || []).forEach(y=>{ if(names.indexOf(y.yilei) < 0) names.push(y.yilei); });
  const fu = names.map(name=>{
    const Y = LOOKUP && LOOKUP.yilei ? LOOKUP.yilei[name] : null;
    if(Y && Y.reviewed && (Y.fu || []).length) return (Y.fu || []).map(f=>'<div class="furow"><span class="big">'+esc(f.ch)+'</span><span class="txt">'+esc(f.note||'')+'</span></div>').join('');
    return '<div class="empty">义类「'+esc(name)+'」的汉语义符对照尚未人工校订。</div>';
  }).join('') || '<div class="empty">未取到义类标注。</div>';
  return '<div class="block"><h4>词　根　拆　解</h4>'+segWordHtml(seg)
    + '<div class="segnote">该词由流水线机械拆解，未经人工复核（AI 生成 · 待人工复核）。</div></div>'
    + '<div class="block"><h4>汉　语　义　符</h4>'+fu+'</div>';
}
let cardDeck = [], cardIdx = 0, cardBack = false;
function updateCardProgress(){
  const total = cardDeck.length;
  const seen = cardDeck.filter(w=>CARD.mastery[w]).length;
  const known = cardDeck.filter(w=>CARD.mastery[w]==='known').length;
  const unk = seen - known;
  const p = $('#cardProg'), t = $('#cardProgTxt');
  if(p) p.style.width = total ? Math.round(seen/total*100)+'%' : '0%';
  if(t) t.textContent = '已学 '+seen+' / '+total+'　·　会了 '+known+'　·　不会 '+unk+'　·　未学 '+(total-seen);
}
function renderCard(){
  const area = $('#cardArea'); if(!area) return;
  cardDeck = deckForYilei(CARD.yilei);
  if(!cardDeck.length){
    area.innerHTML = '<div class="deckdone">该义类当前没有可复习的词条。<br>'
      + (LOOKUP ? '' : '（词源库未加载，仅内联的水 / 手 / 心三个义类可用）') + '</div>';
    updateCardProgress(); return;
  }
  if(cardIdx < 0) cardIdx = 0;
  if(cardIdx >= cardDeck.length) cardIdx = cardDeck.length - 1;
  const word = cardDeck[cardIdx];
  const info = cardWordInfo(word);
  const st = CARD.mastery[word] || 'unseen';
  const stTxt = st==='known' ? '会了' : st==='unknown' ? '不会' : '未学';
  const stCls = st==='known' ? 'known' : st==='unknown' ? 'unknown' : '';
  const badge = (info && info.reviewed) ? '<span class="badge ok">已人工复核</span>'
              : '<span class="badge wait">AI 生成 · 待人工复核</span>';
  let inner;
  if(cardBack){
    inner = '<div class="fword" style="font-size:19px">'+esc(word)+'</div>'
      + '<div class="back">'+(info ? cardBackHtml(info) : '<div class="empty">未取到该词的拆解数据。</div>')+'</div>';
  } else {
    inner = '<span class="mtag '+stCls+'">'+stTxt+'</span>'
      + '<div class="fword">'+esc(word)+'</div>'
      + (info && info.ipa ? '<div class="fipa">'+esc(info.ipa)+'</div>' : '')
      + '<div class="fdef">'+esc(info && info.def ? info.def : '未取到释义')+'</div>'
      + badge;
  }
  area.innerHTML = '<div class="thecard">'+inner+'</div>'
    + '<div class="cardbtns">'
    +   '<button class="btn" id="cbFlip">'+(cardBack?'看正面':'翻面看拆解')+'</button>'
    +   '<button class="btn" id="cbKnown">会了</button>'
    +   '<button class="btn" id="cbUnknown">不会</button>'
    +   '<button class="btn small" id="cbPrev">上一个</button>'
    +   '<button class="btn small" id="cbNext">下一个</button>'
    + '</div>'
    + '<div class="progtxt" style="text-align:center;margin-top:12px">第 '+(cardIdx+1)+' / '+cardDeck.length+' 张</div>';
  $('#cbFlip').onclick = ()=>{ cardBack = !cardBack; renderCard(); };
  $('#cbKnown').onclick = ()=> markCard('known');
  $('#cbUnknown').onclick = ()=> markCard('unknown');
  $('#cbPrev').onclick = ()=>{ cardIdx = (cardIdx-1+cardDeck.length)%cardDeck.length; cardBack=false; renderCard(); };
  $('#cbNext').onclick = ()=>{ cardIdx = (cardIdx+1)%cardDeck.length; cardBack=false; renderCard(); };
  updateCardProgress();
}
function markCard(status){
  const word = cardDeck[cardIdx];
  CARD.mastery[word] = status;
  saveCardStore();
  cardIdx = (cardIdx+1)%cardDeck.length; cardBack = false;
  renderCard();
}

/* 小测 */
let quiz = null;   /* {q, answer, options, done, right} */
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function makeQuiz(){
  cardDeck = deckForYilei(CARD.yilei);
  if(cardDeck.length < 2){
    quiz = null;
    $('#quizArea').innerHTML = '<div class="deckdone">该义类词条太少（少于 2 条），无法出题。</div>';
    return;
  }
  const pool = cardDeck.map(cardWordInfo).filter(x=>x && x.def);
  if(pool.length < 2){
    quiz = null;
    $('#quizArea').innerHTML = '<div class="deckdone">该义类可用释义不足，无法出题。'+(LOOKUP?'':'请先用本地服务器加载词源库。')+'</div>';
    return;
  }
  const answer = pool[Math.floor(Math.random()*pool.length)];
  const others = shuffle(pool.filter(x=>x.word!==answer.word)).slice(0,3);
  const options = shuffle([answer].concat(others)).map(x=>x.word);
  quiz = {q:answer, answer:answer.word, options:options, done:false, right:false};
  renderQuiz();
}
function renderQuiz(){
  const area = $('#quizArea'); if(!area) return;
  if(!quiz){ area.innerHTML = ''; return; }
  const opts = quiz.options.map(o=>{
    let cls = 'quizopt';
    if(quiz.done){
      if(o===quiz.answer) cls += ' right';
      else if(o===quiz.picked) cls += ' wrong';
    }
    return '<button class="'+cls+'" data-o="'+esc(o)+'">'+esc(o)+'</button>';
  }).join('');
  area.innerHTML = '<div class="thecard">'
    + '<div class="quizq">选出与这个释义对应的英文词：<b>'+esc(quiz.q.def)+'</b></div>'
    + '<div class="quizopts">'+opts+'</div>'
    + '<div class="quizfb'+(quiz.done?(quiz.right?' ok':' no'):'')+'">'
    +   (quiz.done ? (quiz.right ? '答对了。' : '答错了，正确答案是 '+esc(quiz.answer)+'。已加入错题本。') : '')
    + '</div>'
    + '</div>'
    + '<div class="cardbtns"><button class="btn primary" id="qNext">'+(quiz.done?'下一题':'换一题')+'</button></div>';
  area.querySelectorAll('.quizopt').forEach(b=>{
    if(quiz.done) return;
    b.onclick = ()=> answerQuiz(b.dataset.o);
  });
  $('#qNext').onclick = ()=> makeQuiz();
}
function answerQuiz(pick){
  if(!quiz || quiz.done) return;
  quiz.done = true;
  quiz.picked = pick;
  quiz.right = (pick === quiz.answer);
  if(quiz.right){
    if(CARD.mastery[quiz.answer] !== 'known') CARD.mastery[quiz.answer] = 'known';
    if(CARD.wrong[quiz.answer]) delete CARD.wrong[quiz.answer];
  } else {
    CARD.wrong[quiz.answer] = {def:(quiz.q.def||''), at:Date.now()};
  }
  saveCardStore();
  renderQuiz();
  renderWrong();
  updateCardProgress();
}
/* 错题本 */
function renderWrong(){
  const area = $('#wrongArea'); if(!area) return;
  const words = Object.keys(CARD.wrong);
  if(!words.length){
    area.innerHTML = '<div class="deckdone">错题本是空的。到“小测”里答错的词会自动收进来。</div>';
    return;
  }
  area.innerHTML = '<div class="vsubhead">错题本（'+words.length+' 词）</div>'
    + '<div class="segnote" style="margin-bottom:16px">答错的词保存在本机浏览器里，刷新后仍在。点“已掌握”把它移出错题本。</div>'
    + words.map(w=>{
        const rec = CARD.wrong[w] || {};
        return '<div class="wrongitem"><span class="ww">'+esc(w)+'</span><span class="wd">'+esc(rec.def||'未取到释义')+'</span>'
          + '<button class="btn small" data-clear="'+esc(w)+'">已掌握</button>'
          + '<button class="btn small" data-ask="'+esc(w)+'">查拆解</button></div>';
      }).join('');
  area.querySelectorAll('[data-clear]').forEach(b=> b.onclick = ()=>{
    delete CARD.wrong[b.dataset.clear]; saveCardStore(); renderWrong();
  });
  area.querySelectorAll('[data-ask]').forEach(b=> b.onclick = ()=>{
    const w = b.dataset.ask;
    showView('dismantle');
    const i = $('#disInput'); if(i) i.value = w;
    doSearch(w);
  });
}

/* ---------- 第4玩法：典故故事线 ---------- */
function renderStories(){
  const box = $('#stories'); if(!box) return;
  const items = DATA_STORIES.map(w=>{
    const story = w.story ? '<div class="storyx">'+w.story+'</div>' : '<div class="empty">该词尚未撰写故事。</div>';
    const rel = (w.rel || []).map(x=>'<span class="chip" data-jump="'+esc(x)+'">'+esc(x)+'</span>').join('');
    return '<div class="tlitem" id="story-'+esc(w.w)+'">'
      + '<h3>'+esc(w.w)+'</h3>'
      + '<div class="mean">'+esc(w.mean)+'　·　义类：'+esc(w.yileiName)+'</div>'
      + story
      + '<div class="relx">'+(rel || '<span class="empty" style="padding:8px 12px;font-size:13px">未取到同源词。</span>')+'</div>'
      + '</div>';
  }).join('');
  box.innerHTML = '<div class="vhead"><h2>典故故事线</h2>'
    + '<p>已人工复核词条的词源故事，共 '+DATA_STORIES.length+' 条。点同源词可在本页跳转；未收录的会如实说明，不做补写。</p></div>'
    + '<div class="tl">'+items+'</div>';
  box.querySelectorAll('.chip[data-jump]').forEach(c=>{
    c.onclick = ()=>{
      const w = c.dataset.jump;
      const t = box.querySelector('#story-'+w);
      if(t){ t.scrollIntoView({behavior:'smooth', block:'center'}); }
      else { c.textContent = w+'（未收录故事）'; c.classList.remove('chip'); c.style.cursor='default'; c.onclick=null; }
    };
  });
}

/* ---------- 卡片页内的三个子页签 ---------- */
function initCardTabs(){
  const bar = $('#cardTabs'); if(!bar) return;
  bar.querySelectorAll('.tabx').forEach(b=>{
    b.onclick = ()=>{
      bar.querySelectorAll('.tabx').forEach(x=> x.classList.toggle('on', x===b));
      const p = b.dataset.p;
      ['review','quiz','wrong'].forEach(k=>{
        const el = $('#pane-'+k); if(el) el.classList.toggle('on', k===p);
      });
      if(p==='quiz' && !quiz) makeQuiz();
      if(p==='wrong') renderWrong();
      if(p==='review') renderCard();
    };
  });
}

/* ---------- 初始化 ---------- */
renderPlays();
loadCardStore();
renderDismantle();
fillCardYilei();
renderCard();
renderStories();
initCardTabs();
showView('roam');
loadLookup();
</script>
