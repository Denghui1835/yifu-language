<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>义符 · 阶段零演示</title>
<style>
:root{
  --paper:#f7f4ee; --paper2:#fffdf8;
  --ink:#221f1b; --ink2:#6b6357; --ink3:#9c9385;
  --zhu:#b8452f;   /* 朱砂 · 汉语侧 */
  --zhu-bg:#f6e6e0;
  --dian:#2f6d8f;  /* 靛青 · 英语侧 */
  --dian-bg:#e2edf4;
  --jin:#c2922c;   /* 金 · 中枢 */
  --jin-bg:#f8efd8;
  --line:#e3ddd1;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.6;
  overflow:hidden;
}
/* 纸纹 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(0,0,0,.028) 1px,transparent 1px);
  background-size:22px 22px;
}

/* ---------- 顶栏 ---------- */
header{
  position:relative;z-index:5;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid var(--line);
  background:rgba(247,244,238,.9);backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:6px}
.brand b{font-family:var(--serif);font-size:25px;letter-spacing:.14em;font-weight:600}
.brand span{font-size:11.5px;color:var(--ink3);letter-spacing:.22em}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);
  padding:6px 15px;border-radius:99px;cursor:pointer;
  font-family:var(--serif);font-size:16px;letter-spacing:.08em;
  transition:.22s;
}
.tab:hover{border-color:var(--jin);color:var(--ink)}
.tab.on{
  background:var(--jin);border-color:var(--jin);color:#fff;
  box-shadow:0 3px 12px rgba(194,146,44,.34);
}
.hint{margin-left:14px;font-size:12.5px;color:var(--ink3)}
@media(max-width:820px){.hint{display:none}}

/* ---------- 主体三栏 ---------- */
main{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr minmax(180px,230px) 1fr;
  gap:0;height:calc(100% - 62px);
}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.col{overflow-y:auto;padding:22px 20px 150px;position:relative;z-index:1}
.col.han{border-right:1px solid var(--line)}
.col.eng{border-left:1px solid var(--line)}
.col::-webkit-scrollbar{width:8px}
.col::-webkit-scrollbar-thumb{background:#ded7c9;border-radius:9px}

.sidehead{
  display:flex;align-items:center;gap:9px;margin-bottom:16px;
  font-size:12px;letter-spacing:.2em;color:var(--ink3);
}
.sidehead i{width:7px;height:7px;border-radius:50%;display:block}
.han .sidehead i{background:var(--zhu)}
.eng .sidehead i{background:var(--dian)}

/* 义符卡片（左） */
.fu{
  display:flex;gap:16px;align-items:center;
  padding:14px 16px;margin-bottom:12px;border-radius:14px;
  background:var(--paper2);border:1px solid var(--line);
  transition:.25s;
}
.fu.hot{border-color:var(--zhu);background:var(--zhu-bg);box-shadow:0 4px 18px rgba(184,69,47,.14)}
.fu .big{font-family:var(--serif);font-size:44px;line-height:1;color:var(--zhu)}
.fu .meta{font-size:12px;color:var(--ink3);line-height:1.75}
.fu .meta b{display:block;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:.06em}
.fu .meta .morph{font-family:var(--serif);color:var(--zhu);font-size:13px}

/* 汉字格 */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px;margin-top:18px}
.hz{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--paper2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;transition:.2s;
}
.hz:hover{border-color:var(--zhu);transform:translateY(-2px)}
.hz.hot{background:var(--zhu);border-color:var(--zhu);box-shadow:0 6px 20px rgba(184,69,47,.3)}
.hz .c{font-family:var(--serif);font-size:27px;line-height:1.1}
.hz .p{font-size:10px;color:var(--ink3);transform:scale(.92)}
.hz.hot .c,.hz.hot .p{color:#fff}

/* 词根卡片（右） */
.root{
  padding:12px 15px;margin-bottom:11px;border-radius:13px;
  background:var(--paper2);border:1px solid var(--line);transition:.25s;
}
.root.hot{border-color:var(--dian);background:var(--dian-bg);box-shadow:0 4px 18px rgba(47,109,143,.14)}
.root .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.root .form{font-size:19px;font-weight:600;color:var(--dian);letter-spacing:.02em}
.root .src{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);
  padding:1px 7px;border-radius:99px;background:var(--paper)}
.root .gloss{font-size:12.5px;color:var(--ink2)}

.wgrid{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.w{
  padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--paper2);
  cursor:pointer;transition:.2s;
}
.w:hover{border-color:var(--dian);transform:translateX(3px)}
.w.hot{background:var(--dian);border-color:var(--dian);box-shadow:0 6px 22px rgba(47,109,143,.32)}
.w .sp{font-size:16.5px;font-weight:600;letter-spacing:.01em}
.w .cn{font-size:12.5px;color:var(--ink3);margin-top:2px}
.w.hot .sp,.w.hot .cn{color:#fff}

/* 中枢 */
.hub{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;position:relative;z-index:3;pointer-events:none;
}
.disc{
  width:132px;height:132px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 30%,#fff8e6,#f3e0b0 72%,#e8cf93);
  border:1px solid #e0c98d;
  box-shadow:0 10px 34px rgba(194,146,44,.28),inset 0 2px 10px rgba(255,255,255,.85);
  transition:.35s;
}
.disc.pulse{box-shadow:0 10px 44px rgba(194,146,44,.55),inset 0 2px 10px rgba(255,255,255,.9);transform:scale(1.045)}
.disc .ch{font-family:var(--serif);font-size:50px;line-height:1;color:#7a5a17;font-weight:600}
.disc .sub{font-size:10.5px;color:#9c7c36;letter-spacing:.16em;margin-top:5px}
.hublabel{font-size:11px;letter-spacing:.3em;color:var(--ink3);text-align:center}
.tally{
  font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.9;
  background:rgba(255,253,248,.86);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;pointer-events:auto;
}
.tally b{color:var(--ink2);font-weight:600}

/* ---------- 详情抽屉 ---------- */
#detail{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  max-height:56vh;overflow-y:auto;
  background:var(--paper2);border-top:1px solid var(--line);
  box-shadow:0 -12px 44px rgba(34,31,27,.13);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,.9,.3,1);
}
#detail.open{transform:translateY(0)}
.dwrap{max-width:1020px;margin:0 auto;padding:22px 26px 30px}
.dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid var(--line)}
.dhead .w1{font-size:27px;font-weight:700;letter-spacing:.01em}
.dhead .ipa{font-size:14px;color:var(--ink3)}
.dhead .mean{font-size:15px;color:var(--ink2)}
.dclose{
  margin-left:auto;border:1px solid var(--line);background:var(--paper);
  width:31px;height:31px;border-radius:50%;cursor:pointer;color:var(--ink2);
  font-size:16px;line-height:1;transition:.2s
}
.dclose:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 拆解链 */
.chain{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:19px 0 6px}
.part{
  padding:9px 15px;border-radius:11px;background:var(--dian-bg);
  border:1px solid #cfe0ea;text-align:center;min-width:74px;
}
.part .p1{font-size:16px;font-weight:700;color:var(--dian)}
.part .p2{font-size:11px;color:var(--ink3);margin-top:2px}
.plus{color:var(--ink3);font-size:15px}
.arrow{color:var(--jin);font-size:19px;font-weight:700;padding:0 3px}
.result{
  padding:9px 17px;border-radius:11px;background:var(--jin-bg);
  border:1px solid #e8d5a5;font-size:15px;font-weight:600;color:#7a5a17;
}
.xref{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  margin-top:17px;padding:13px 16px;border-radius:12px;
  background:var(--zhu-bg);border:1px solid #eed6cd;
}
.xref .k{font-size:11.5px;color:#8d6a5f;letter-spacing:.1em}
.xref .hzbig{font-family:var(--serif);font-size:32px;color:var(--zhu);line-height:1}
.xref .txt{font-size:13.5px;color:#6d4a3f;flex:1;min-width:180px}

.sec{margin-top:19px}
.sec h4{
  font-size:11.5px;letter-spacing:.24em;color:var(--ink3);
  font-weight:500;margin:0 0 8px;
}
.story{font-size:14.5px;line-height:1.95;color:#3a352e}
.story em{font-style:normal;color:var(--zhu);font-weight:600}
.story b{color:var(--dian);font-weight:600}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.rel span{
  padding:5px 13px;border-radius:99px;background:var(--paper);
  border:1px solid var(--line);font-size:13px;color:var(--ink2);cursor:pointer;transition:.2s
}
.rel span:hover{border-color:var(--dian);color:var(--dian)}

.note{
  margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--ink3);line-height:1.85;
}

/* 两条演变线 */
.evo{display:flex;flex-direction:column;gap:11px}
.evorow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.tag{
  flex:none;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;font-weight:600;color:#fff;
}
.tag.h{background:var(--zhu)} .tag.e{background:var(--dian)}
.step{
  padding:5px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;
  background:var(--paper);border:1px solid var(--line);color:var(--ink2);
}
.evorow.h .step:last-child{background:var(--zhu-bg);border-color:#e6c8bd;color:var(--zhu);font-weight:600}
.evorow.e .step:last-child{background:var(--dian-bg);border-color:#cbe0ec;color:var(--dian);font-weight:600}
.arw{color:var(--ink3);font-size:12px;flex:none}

@media(max-width:900px){
  main{grid-template-columns:1fr;height:auto;overflow-y:auto}
  .col.han{border-right:0;border-bottom:1px solid var(--line)}
  .col.eng{border-left:0;border-top:1px solid var(--line)}
  .hub{order:-1;padding:22px 0}
  #wires{display:none}
  body{overflow:auto}
  .col{padding-bottom:40px;max-height:none}
}
</style>
</head>
<body>

<header>
  <div class="brand"><b>义符</b><span>阶段零演示</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="hint">点右边的英文词，看左边的义符亮起来 →</div>
</header>

<main id="board">
  <svg id="wires"></svg>

  <section class="col han" id="colHan">
    <div class="sidehead"><i></i>汉语义符</div>
    <div id="fus"></div>
    <div class="sidehead" style="margin-top:26px"><i></i>同义类汉字</div>
    <div class="hgrid" id="hgrid"></div>
  </section>

  <section class="hub">
    <div class="hublabel">义　类</div>
    <div class="disc" id="disc">
      <div class="ch" id="hubCh">水</div>
      <div class="sub" id="hubSub">液体·流动</div>
    </div>
    <div class="tally" id="tally"></div>
  </section>

  <section class="col eng" id="colEng">
    <div class="sidehead"><i></i>英语词根</div>
    <div id="roots"></div>
    <div class="sidehead" style="margin-top:26px"><i></i>派生词　<span style="letter-spacing:0" id="wnum"></span></div>
    <div class="wgrid" id="wgrid"></div>
  </section>
</main>

<aside id="detail"><div class="dwrap" id="dwrap"></div></aside>

<script>
/* ============================================================
   数据层：义类 →（汉语义符 | 英语词根）→ 词条
   这是产品内核的原型。词源均已核对，出处存疑者不入库。
   ============================================================ */
const DATA = {
  shui: {
    id:'S01', name:'水', sub:'液体·流动',
    fu:[
      {ch:'氵', from:'水', note:'水作左偏旁时的简省写法', cov:'江河流湖海'},
      {ch:'水', from:'水', note:'甲骨文象流水之形，本字', cov:'泉浆淼'}
    ],
    chars:[
      {c:'江',p:'jiāng',m:'大河，特指长江'},
      {c:'河',p:'hé',m:'大河，特指黄河'},
      {c:'湖',p:'hú',m:'陆地上的大型水域'},
      {c:'海',p:'hǎi',m:'大洋靠近陆地的部分'},
      {c:'洋',p:'yáng',m:'比海更广大的水域'},
      {c:'深',p:'shēn',m:'从水面到底部距离大'},
      {c:'浅',p:'qiǎn',m:'与深相对'},
      {c:'波',p:'bō',m:'水面起伏'},
      {c:'浪',p:'làng',m:'大的波'},
      {c:'滴',p:'dī',m:'一点点的水'}
    ],
    roots:[
      {form:'aqua-',src:'拉丁',gloss:'水'},
      {form:'hydr-',src:'希腊',gloss:'水'},
      {form:'mar-',src:'拉丁',gloss:'海'}
    ],
    words:[
      {w:'aquarium',ipa:'/əˈkweəriəm/',root:'aqua-',mean:'水族馆；水族箱',
       parts:[{p:'aqua',g:'水'},{p:'-arium',g:'场所'}],
       result:'装水的场所',
       hz:{c:'池',note:'氵＋也。aquarium 的 -arium 等于汉语里表场所的"池、塘"' },
       story:'拉丁 <b>aqua</b>（水）加上表场所的后缀 <b>-arium</b>。1853 年伦敦动物园第一次用这个词指养水生生物的容器。同一个 aqua 还长出了 aquatic（水生的）、aqueduct（引水渠）。',
       rel:['aquatic','aqueduct','aquamarine']},
      {w:'aquatic',ipa:'/əˈkwætɪk/',root:'aqua-',mean:'水生的；水上的',
       parts:[{p:'aqua',g:'水'},{p:'-atic',g:'形容词后缀'}],
       result:'属于水的',
       hz:{c:'泳',note:'氵＋永。"泳"是人在水里，aquatic 是物在水里，同挂一个义类'},
       story:'同样是 <b>aqua</b>。汉语用"氵"造出泳、浮、沉、潜，英语用 aqua- 造出 aquatic、aquaplane。两边的做法完全一样：把"水"这个义类贴到新词上。',
       rel:['aquarium','aqueduct']},
      {w:'aqueduct',ipa:'/ˈækwɪdʌkt/',root:'aqua-',mean:'引水渠；高架水道',
       parts:[{p:'aqua',g:'水'},{p:'duct',g:'引导（拉丁 ducere）'}],
       result:'引导水的东西',
       hz:{c:'渠',note:'氵＋矩。古罗马的 aqueduct 就是罗马人的"渠"'},
       story:'<b>aqua</b> 加 <b>duct</b>。duct 出自拉丁 ducere（引导），同族还有 conduct、introduce、produce。古罗马用高架水道把水送进城里，那些石拱至今还立在法国和西班牙。',
       rel:['aquarium','aquatic','conduct']},
      {w:'hydrate',ipa:'/ˈhaɪdreɪt/',root:'hydr-',mean:'水合物；使水合',
       parts:[{p:'hydr',g:'水（希腊 hydor）'},{p:'-ate',g:'动词/名词后缀'}],
       result:'与水结合',
       hz:{c:'湿',note:'氵＋显。"湿"是含了水，hydrate 是结合了水'},
       story:'注意：同一个"水"义类，英语有两套词根。日常的用拉丁 <b>aqua</b>，学术的用希腊 <b>hydr</b>。这不是冗余，是历史分层——希腊词根是文艺复兴时期大批涌进学术圈的。',
       rel:['hydrogen','dehydrate','hydroelectric']},
      {w:'hydrogen',ipa:'/ˈhaɪdrədʒən/',root:'hydr-',mean:'氢',
       parts:[{p:'hydro',g:'水'},{p:'-gen',g:'产生（希腊 genos）'}],
       result:'产生水的东西',
       hz:{c:'氢',note:'气＋巠。汉语造化学字用"气"作义符，英语用 -gen，都是贴义类'},
       story:'<b>hydro</b> 加 <b>-gen</b>（产生）。1787 年拉瓦锡命名它，因为这种气体燃烧后生成水。所以"氢"这个字的英文名字直译就是"造水的东西"。汉语造字时把它归到"气"部，英语归到 hydro，两边各贴各的义符。',
       rel:['hydrate','dehydrate','oxygen']},
      {w:'dehydrate',ipa:'/diːˈhaɪdreɪt/',root:'hydr-',mean:'脱水；使干燥',
       parts:[{p:'de-',g:'去除'},{p:'hydr',g:'水'},{p:'-ate',g:'后缀'}],
       result:'把水去掉',
       hz:{c:'干',note:'汉语说"干"，是水的缺席；英语用 de- 前缀把水"拿走"'},
       story:'前缀 <b>de-</b> 表示"去除、向下"，加在水上就是脱水。汉语遇到同样的意思，用"去掉水"或单一个"干"字。有意思的是：汉语倾向于描述状态，英语倾向于描述动作的方向。',
       rel:['hydrate','hydrogen']},
      {w:'marine',ipa:'/məˈriːn/',root:'mar-',mean:'海洋的；海军陆战队',
       parts:[{p:'mar',g:'海（拉丁 mare）'},{p:'-ine',g:'形容词后缀'}],
       result:'属于海的',
       hz:{c:'海',note:'氵＋每。marine 和"海"是同一个义类节点'},
       story:'拉丁 <b>mare</b>（海）。同族有 maritime、submarine、marina。有趣的是罗马人管地中海叫 Mare Nostrum——"我们的海"。',
       rel:['maritime','submarine','aquamarine']},
      {w:'maritime',ipa:'/ˈmærɪtaɪm/',root:'mar-',mean:'海上的；沿海的',
       parts:[{p:'marit',g:'海（拉丁 maritimus）'},{p:'-ime',g:'形容词后缀'}],
       result:'和海有关的',
       hz:{c:'沿',note:'氵＋㕣（yǎn，声符）。"沿海"和 maritime 说的是同一件事'},
       story:'同样来自拉丁 <b>mare</b>，只是走了一条更长的路：maritimus 直接进了英语，没经过法语。所以 marine 和 maritime 意思相近却长得不太像——它们是从不同的门进来的。',
       rel:['marine','submarine']},
      {w:'submarine',ipa:'/ˌsʌbməˈriːn/',root:'mar-',mean:'潜艇；水下的',
       parts:[{p:'sub-',g:'在下面'},{p:'mar',g:'海'},{p:'-ine',g:'后缀'}],
       result:'海面之下的',
       hz:{c:'潜',note:'氵＋替的声符。"潜"是没入水下，submarine 是"海之下"，结构一模一样'},
       story:'<b>sub-</b>（下）加 <b>marine</b>（海的）。汉语的"潜"是氵部；英语的 submarine 是 mar- 根。同一个动作，两边都把它挂到了"水"这个义类上，只是汉语把它压进了字形，英语把它摊开成拼写。',
       rel:['marine','maritime','submerge']},
      {w:'aquamarine',ipa:'/ˌækwəməˈriːn/',root:'aqua-',mean:'海蓝宝石；浅蓝绿色',
       parts:[{p:'aqua',g:'水'},{p:'marine',g:'海'}],

    concord:['拉丁 con- 共同 + cor 心','古法语 concorde','中古英语 concord'],
    psychology:['希腊 psyche　呼吸、灵魂','希腊 -logia　学问','拉丁 psychologia　16 世纪','18 世纪进入英语'],
    psychiatrist:['希腊 psyche　心灵','希腊 iatros　医生','法语 psychiatre　1802','19 世纪进入英语'],
    sympathy:['希腊 syn- 共同 + pathos 感受','希腊 sympatheia','拉丁 sympathia','16 世纪进入英语'],
    empathy:['希腊 en- 进入 + pathos 感受','德语 Einfühlung　1909 铁钦纳译作 empathy','20 世纪进入英语']
  }
};

/* ============================================================
   渲染
   ============================================================ */
const $ = s => document.querySelector(s);
let cur = 'shui';
let sel = null;          // {word: idx}
let selChar = null;

function renderTabs(){
  $('#tabs').innerHTML = Object.entries(DATA).map(([k,v])=>
    `<button class="tab ${k===cur?'on':''}" data-k="${k}">${v.name}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ cur = b.dataset.k; sel = null; selChar = null; closeDetail(); renderAll(); };
  });
}

function renderAll(){
  const d = DATA[cur];
  $('#hubCh').textContent = d.name;
  $('#hubSub').textContent = d.sub;
  $('#tally').innerHTML =
    `汉语义符 <b>${d.fu.length}</b> 个　·　汉字 <b>${d.chars.length}</b> 个<br>` +
    `英语词根 <b>${d.roots.length}</b> 个　·　词条 <b>${d.words.length}</b> 个`;

  // 左：义符
  $('#fus').innerHTML = d.fu.map((f,i)=>
    `<div class="fu" id="fu${i}">
       <div class="big">${f.ch}</div>
       <div class="meta">
         <b>${f.from === f.ch ? '本字' : f.from + ' 的变形'}</b>
         <span class="morph">${f.from} → ${f.ch}</span><br>
         ${f.note}
       </div>
     </div>`).join('');

  // 左：汉字
  $('#hgrid').innerHTML = d.chars.map((c,i)=>
    `<div class="hz" id="hz${i}" data-i="${i}">
       <div class="c">${c.c}</div><div class="p">${c.p}</div>
     </div>`).join('');
  $('#hgrid').querySelectorAll('.hz').forEach(el=>{
    el.onclick = ()=> pickChar(+el.dataset.i);
  });

  // 右：词根
  $('#roots').innerHTML = d.roots.map((r,i)=>
    `<div class="root" id="rt${i}">
       <div class="top">
         <span class="form">${r.form}</span>
         <span class="src">${r.src}</span>
         <span class="gloss">${r.gloss}</span>
       </div>
     </div>`).join('');

  // 右：词
  $('#wnum').textContent = `（${d.words.length}）`;
  $('#wgrid').innerHTML = d.words.map((w,i)=>
    `<div class="w" id="w${i}" data-i="${i}">
       <div class="sp">${w.w}</div>
       <div class="cn">${w.mean}</div>
     </div>`).join('');
  $('#wgrid').querySelectorAll('.w').forEach(el=>{
    el.onclick = ()=> pickWord(+el.dataset.i);
  });

  renderTabs();
  clearHighlight();
}

/* ---------- 高亮与连线 ---------- */
function clearHighlight(){
  document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  $('#wires').innerHTML = '';
}

function pickWord(i){
  clearHighlight();
  sel = i; selChar = null;
  const d = DATA[cur], w = d.words[i];
  $('#w'+i).classList.add('hot');

  // 命中的词根
  const ri = d.roots.findIndex(r => w.root === r.form);
  if(ri >= 0) $('#rt'+ri).classList.add('hot');

  // 命中的义符（全部点亮 —— 这就是"啊哈"）
  d.fu.forEach((f,j)=> $('#fu'+j).classList.add('hot'));

  // 随机挑一个同义类汉字作为对照
  const ci = i % d.chars.length;
  $('#hz'+ci)?.classList.add('hot');

  $('#disc').classList.add('pulse');
  setTimeout(()=>$('#disc').classList.remove('pulse'), 620);

  drawWires(i, ci);
  openDetail(w);
}

function pickChar(i){
  clearHighlight();
  selChar = i; sel = null;
  const d = DATA[cur], c = d.chars[i];
  $('#hz'+i).classList.add('hot');
  d.fu.forEach((f,j)=> $('#fu'+j).classList.add('hot'));
  d.roots.forEach((r,j)=> $('#rt'+j)?.classList.add('hot'));
  $('#disc').classList.add('pulse');
  setTimeout(()=>$('#disc').classList.remove('pulse'), 620);
  openCharDetail(c, d);
}

function drawWires(wi, ci){
  const svg = $('#wires'), board = $('#board');
  if(window.innerWidth <= 900) return;
  const bb = board.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${bb.width} ${bb.height}`);
  const wEl = $('#w'+wi), hEl = $('#hz'+ci), disc = $('#disc');
  if(!wEl || !hEl || !disc) return;
  const r = e => {
    const x = e.getBoundingClientRect();
    return {l:x.left-bb.left, r:x.right-bb.left, cx:x.left-bb.left+x.width/2,
            cy:x.top-bb.top+x.height/2, t:x.top-bb.top};
  };
  const W = r(wEl), H = r(hEl), D = r(disc);

  const mk = (x1,y1,x2,y2,color,dash) => {
    const mx = (x1+x2)/2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
      fill="none" stroke="${color}" stroke-width="1.7"
      ${dash?'stroke-dasharray="5 5"':''} opacity=".85"
      stroke-linecap="round"/>`;
  };
  const dot = (x,y,c) => `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`;

  svg.innerHTML =
    mk(W.l, W.cy, D.r, D.cy, '#2f6d8f', false) +
    mk(D.l, D.cy, H.r, H.cy, '#b8452f', true) +
    dot(W.l, W.cy, '#2f6d8f') + dot(H.r, H.cy, '#b8452f') +
    dot(D.r, D.cy, '#2f6d8f') + dot(D.l, D.cy, '#b8452f');

  // 只有实线那条做"书写"动画；虚线那条保持虚线观感，别被覆盖
  const solid = svg.querySelectorAll('path')[0];
  if(solid){
    const L = solid.getTotalLength();
    solid.animate([{strokeDasharray:`${L} ${L}`, strokeDashoffset:L},
                   {strokeDasharray:`${L} ${L}`, strokeDashoffset:0}],
                  {duration:620, easing:'cubic-bezier(.3,.8,.3,1)', fill:'forwards'});
  }
}

/* ---------- 详情 ---------- */
function openDetail(w){
  const chain = w.parts.map(p =>
      `<div class="part"><div class="p1">${p.p}</div><div class="p2">${p.g}</div></div>`
    ).join('<span class="plus">+</span>');

  $('#dwrap').innerHTML = `
    <div class="dhead">
      <span class="w1">${w.w}</span>
      <span class="ipa">${w.ipa}</span>
      <span class="mean">${w.mean}</span>
      <button class="dclose" onclick="closeDetail()">×</button>
    </div>

    <div class="chain">${chain}<span class="arrow">→</span>
      <div class="result">${w.result}</div></div>

    <div class="xref">
      <span class="k">汉语同义类</span>
      <span class="hzbig">${w.hz.c}</span>
      <span class="txt">${w.hz.note}</span>
    </div>

    <div class="sec"><h4>两　条　演　变　线</h4>
      <div class="evo">
        <div class="evorow h">
          <span class="tag h">汉</span>
          ${(EVO.han[cur]||[]).map((s,i)=>
            (i?'<span class="arw">→</span>':'')+`<span class="step">${s}</span>`).join('')}
        </div>
        <div class="evorow e">
          <span class="tag e">英</span>
          ${(EVO.eng[w.w]||['—']).map((s,i)=>
            (i?'<span class="arw">→</span>':'')+`<span class="step">${s}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="sec"><h4>词　源</h4><div class="story">${w.story}</div></div>

    <div class="sec"><h4>同　根　词</h4><div class="rel">
      ${w.rel.map(x=>`<span>${x}</span>`).join('')}
    </div></div>

    <div class="note">词源已核对。出处存疑的内容不在本演示中展示。</div>
  `;
  $('#detail').classList.add('open');
}

function openCharDetail(c, d){
  $('#dwrap').innerHTML = `
    <div class="dhead">
      <span class="w1">${c.c}</span>
      <span class="ipa">${c.p}</span>
      <span class="mean">${c.m}</span>
      <button class="dclose" onclick="closeDetail()">×</button>
    </div>

    <div class="xref" style="margin-top:19px">
      <span class="k">所属义类</span>
      <span class="hzbig">${d.name}</span>
      <span class="txt">本字归入"${d.name}"义类。${d.fu.map(f=>
        f.ch).join('、')} 都是这个义类在汉语里的写法。</span>
    </div>

    <div class="sec"><h4>义符说明</h4><div class="story">
      ${d.fu.map(f=>
        `<b>${f.ch}</b> 是 <em>${f.from}</em> 作偏旁时的写法，${f.note}。常用字如：${f.cov}。`
      ).join('<br>')}
    </div></div>

    <div class="sec"><h4>这　个　义　符　是　怎　么　来　的</h4>
      <div class="evo">
        <div class="evorow h">
          <span class="tag h">汉</span>
          ${(EVO.han[cur]||[]).map((s,i)=>
            (i?'<span class="arw">→</span>':'')+`<span class="step">${s}</span>`).join('')}
        </div>
        <div class="evorow e">
          <span class="tag e">英</span>
          <span class="step">英语的义符系统是词根，它同样从拉丁、希腊一路演变而来</span>
        </div>
      </div>
    </div>

    <div class="sec"><h4>同义类的英语词根</h4><div class="rel">
      ${d.roots.map(r=>`<span>${r.form}　${r.src}·${r.gloss}</span>`).join('')}
    </div></div>

    <div class="note">点右侧的英文词，可以看到它挂到同一个义类上的过程。</div>
  `;
  $('#detail').classList.add('open');
}

function closeDetail(){ $('#detail').classList.remove('open'); }

document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeDetail(); });
window.addEventListener('resize', ()=>{ if(sel !== null) pickWord(sel); });
// 栏内滚动会让连线坐标失效，直接清掉，避免画出悬空的线
['#colHan','#colEng'].forEach(s=>{
  $(s).addEventListener('scroll', ()=>{ $('#wires').innerHTML = ''; }, {passive:true});
});

renderAll();
</script>
</body>
</html>
